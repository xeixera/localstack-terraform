name: localstack-tf

on:
  push:
    branches:
      - main
      - test

  pull_request:
    branches:
      - main
      - test

  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-terraform
        uses: hashicorp/setup-terraform@v3

      - name: terraform-fmt
        run: terraform fmt -check -recursive

      - name: terraform-validate
        run: terraform validate